<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef's Menu Manager — Live App Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6750a4;
            --primary-container: #eaddff;
            --on-primary-container: #21005d;
            --surface: #fef7ff;
            --surface-variant: #e7e0ec;
            --on-surface: #1d1b20;
            --on-surface-variant: #49454f;
            --outline: #79747e;
            --bg-page: #f4f0fa;

            --badge-starter: #e3f2fd;
            --badge-starter-text: #0d47a1;
            --badge-main: #e8f5e9;
            --badge-main-text: #1b5e20;
            --badge-dessert: #f3e5f5;
            --badge-dessert-text: #4a148c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--on-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px 40px;
        }

        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .repo-link {
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.9rem;
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* Phone App Frame */
        .app-frame {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 16px 40px rgba(103, 80, 164, 0.12), 0 4px 12px rgba(0,0,0,0.05);
            border: 6px solid #2b2930;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top App Bar */
        .app-bar {
            background: var(--surface);
            padding: 20px 20px 12px 20px;
            border-bottom: 1px solid var(--surface-variant);
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--on-surface);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-subtitle {
            font-size: 0.8rem;
            color: var(--on-surface-variant);
            font-weight: 600;
            margin-top: 2px;
        }

        .app-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 680px;
            overflow-y: auto;
        }

        /* Stats Card */
        .stats-card {
            background: var(--primary-container);
            color: var(--on-primary-container);
            border-radius: 20px;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            padding: 10px 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--on-primary-container);
        }

        .stat-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--on-surface-variant);
            margin-top: 2px;
        }

        /* Search Input */
        .search-box {
            width: 100%;
            background: var(--surface-variant);
            border: none;
            padding: 12px 18px;
            border-radius: 28px;
            font-size: 0.9rem;
            outline: none;
            color: var(--on-surface);
        }

        .search-box::placeholder {
            color: var(--on-surface-variant);
        }

        /* Filter Chips */
        .chips-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chip-btn {
            background: var(--surface-variant);
            color: var(--on-surface-variant);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .chip-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Menu List */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dish-item {
            background: #ffffff;
            border: 1px solid var(--surface-variant);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: transform 0.15s ease;
        }

        .dish-item:hover {
            transform: translateY(-2px);
        }

        .dish-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 240px;
        }

        .dish-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--on-surface);
        }

        .dish-desc {
            font-size: 0.78rem;
            color: var(--on-surface-variant);
            line-height: 1.3;
        }

        .course-badge {
            align-self: flex-start;
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.68rem;
            font-weight: 800;
            margin-top: 4px;
        }

        .badge-Starter { background: var(--badge-starter); color: var(--badge-starter-text); }
        .badge-Main-Course { background: var(--badge-main); color: var(--badge-main-text); }
        .badge-Dessert { background: var(--badge-dessert); color: var(--badge-dessert-text); }

        .dish-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .dish-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary);
        }

        .dish-actions {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            background: var(--surface-variant);
            border: none;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--on-surface);
        }

        .btn-action.delete {
            background: #ffebee;
            color: #c62828;
        }

        /* Floating Add FAB */
        .fab {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 28px;
            font-weight: 800;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(103, 80, 164, 0.35);
            transition: transform 0.2s ease;
        }

        .fab:hover {
            transform: scale(1.04);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--on-surface-variant);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Dialog Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-card {
            background: white;
            width: 100%;
            border-radius: 28px 28px 0 0;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--on-surface-variant);
        }

        .input-group input, .input-group select {
            padding: 10px 14px;
            border: 1px solid var(--outline);
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-modal {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-cancel {
            background: var(--surface-variant);
            color: var(--on-surface);
        }

        .btn-save {
            background: var(--primary);
            color: white;
        }

        footer {
            margin-top: 24px;
            font-size: 0.82rem;
            color: var(--on-surface-variant);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <span style="font-weight: 800; font-size: 1.1rem;">🍽️ Chef's Menu Manager</span>
        <a href="https://github.com/Sibulelo-james/Chefsmenu" target="_blank" class="repo-link">View Source Code</a>
    </div>

    <!-- Phone Interface Frame -->
    <div class="app-frame">
        <div class="app-bar">
            <div class="app-title">🍽️ Chef's Menu Manager</div>
            <div class="app-subtitle" id="totalCountSubtitle">3 items total</div>
        </div>

        <div class="app-body">
            <!-- Real-time Statistics Card -->
            <div class="stats-card">
                <div class="stat-box">
                    <div class="stat-value" id="avgPriceText">R 165.00</div>
                    <div class="stat-label">Average Price</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="breakdownText">1S · 1M · 1D</div>
                    <div class="stat-label">Course Breakdown</div>
                </div>
            </div>

            <!-- Search Bar -->
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search dish name..." aria-label="Search dish name" oninput="renderDishes()">

            <!-- Category Filter Chips -->
            <div class="chips-container">
                <button class="chip-btn active" onclick="setFilter('All', this)">All</button>
                <button class="chip-btn" onclick="setFilter('Starter', this)">Starters</button>
                <button class="chip-btn" onclick="setFilter('Main Course', this)">Main Courses</button>
                <button class="chip-btn" onclick="setFilter('Dessert', this)">Desserts</button>
            </div>

            <!-- Dishes List -->
            <div class="menu-list" id="menuList"></div>
        </div>

        <!-- Floating Add Button -->
        <button class="fab" onclick="openModal()">➕ Add Dish</button>

        <!-- Add/Edit Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card">
                <div class="modal-title" id="modalTitle">Add Menu Item</div>
                <div class="input-group">
                    <label>Dish Name</label>
                    <input type="text" id="dishNameInput" placeholder="e.g. Grilled Salmon">
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <input type="text" id="dishDescInput" placeholder="e.g. Served with fresh lemon & herbs">
                </div>
                <div class="input-group">
                    <label>Course</label>
                    <select id="dishCourseSelect">
                        <option value="Starter">Starter</option>
                        <option value="Main Course" selected>Main Course</option>
                        <option value="Dessert">Dessert</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Price (ZAR - R)</label>
                    <input type="number" id="dishPriceInput" placeholder="e.g. 185">
                </div>
                <div class="modal-actions">
                    <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn-modal btn-save" onclick="saveDish()">Save Dish</button>
                </div>
            </div>
        </div>
    </div>

    <footer>Developed by Sibulelo-james • Android App Demo</footer>

    <script>
        let dishes = [
            { id: 1, name: "Bruschetta", desc: "Toasted garlic bread topped with tomatoes & basil", course: "Starter", price: 85.00 },
            { id: 2, name: "Grilled Salmon", desc: "Atlantic salmon served with tender asparagus", course: "Main Course", price: 260.00 },
            { id: 3, name: "Tiramisu", desc: "Classic Italian espresso-flavored layered dessert", course: "Dessert", price: 150.00 }
        ];

        let currentFilter = 'All';
        let editingDishId = null;

        function setFilter(course, btn) {
            currentFilter = course;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDishes();
        }

        function renderDishes() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const listContainer = document.getElementById('menuList');

            const filtered = dishes.filter(d => {
                const matchesCourse = (currentFilter === 'All' || d.course === currentFilter);
                const matchesSearch = d.name.toLowerCase().includes(search);
                return matchesCourse && matchesSearch;
            });

            updateStats();

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="empty-state">No dishes match your current search or filter.</div>`;
                return;
            }

            listContainer.innerHTML = filtered.map(d => `
                <div class="dish-item">
                    <div class="dish-left">
                        <div class="dish-name">${escapeHtml(d.name)}</div>
                        <div class="dish-desc">${escapeHtml(d.desc)}</div>
                        <span class="course-badge badge-${d.course.replace(' ', '-')}">${d.course}</span>
                    </div>
                    <div class="dish-right">
                        <div class="dish-price">R ${d.price.toFixed(2)}</div>
                        <div class="dish-actions">
                            <button class="btn-action" onclick="editDish(${d.id})">Edit</button>
                            <button class="btn-action delete" onclick="deleteDish(${d.id})">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalCountSubtitle').innerText = `${dishes.length} items total`;

            if (dishes.length === 0) {
                document.getElementById('avgPriceText').innerText = "R 0.00";
                document.getElementById('breakdownText').innerText = "0S · 0M · 0D";
                return;
            }

            const total = dishes.reduce((sum, d) => sum + d.price, 0);
            const avg = total / dishes.length;
            document.getElementById('avgPriceText').innerText = `R ${avg.toFixed(2)}`;

            const starters = dishes.filter(d => d.course === 'Starter').length;
            const mains = dishes.filter(d => d.course === 'Main Course').length;
            const desserts = dishes.filter(d => d.course === 'Dessert').length;

            document.getElementById('breakdownText').innerText = `${starters}S · ${mains}M · ${desserts}D`;
        }

        function openModal() {
            editingDishId = null;
            document.getElementById('modalTitle').innerText = 'Add Menu Item';
            document.getElementById('dishNameInput').value = '';
            document.getElementById('dishDescInput').value = '';
            document.getElementById('dishCourseSelect').value = 'Main Course';
            document.getElementById('dishPriceInput').value = '';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function saveDish() {
            const name = document.getElementById('dishNameInput').value.trim();
            const desc = document.getElementById('dishDescInput').value.trim();
            const course = document.getElementById('dishCourseSelect').value;
            const price = parseFloat(document.getElementById('dishPriceInput').value);

            if (!name || !desc || isNaN(price) || price <= 0) {
                alert('Please enter a valid dish name, description, and price.');
                return;
            }

            if (editingDishId !== null) {
                const idx = dishes.findIndex(d => d.id === editingDishId);
                if (idx !== -1) {
                    dishes[idx] = { id: editingDishId, name, desc, course, price };
                }
            } else {
                dishes.push({ id: Date.now(), name, desc, course, price });
            }

            closeModal();
            renderDishes();
        }

        function editDish(id) {
            const dish = dishes.find(d => d.id === id);
            if (!dish) return;

            editingDishId = id;
            document.getElementById('modalTitle').innerText = 'Edit Menu Item';
            document.getElementById('dishNameInput').value = dish.name;
            document.getElementById('dishDescInput').value = dish.desc;
            document.getElementById('dishCourseSelect').value = dish.course;
            document.getElementById('dishPriceInput').value = dish.price;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function deleteDish(id) {
            if (confirm('Are you sure you want to delete this menu item?')) {
                dishes = dishes.filter(d => d.id !== id);
                renderDishes();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Initial render
        renderDishes();
    </script>
</body>
</html>
